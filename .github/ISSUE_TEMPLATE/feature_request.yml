name: Feature request
description: Suggest something Gravity should be able to do.
title: "[feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        The proposals that land describe a workflow that is painful today rather than a
        widget. "I lose track of who owes whom a reply across two products" gets built.
        "Add a Gantt chart" gets a question back. Check the [roadmap](https://github.com/Noveum/gravity/blob/main/docs/roadmap.md) first.

        One rule is fixed: nothing sends a message on a user's behalf without an explicit,
        approved send. A due date, sequence step or webhook is never permission to send.
  - type: textarea
    id: problem
    attributes:
      label: What is painful today
      description: The situation, not the solution. What are you trying to get done, and where does Gravity get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Gravity
      options:
        - Next actions queue
        - People, companies and relationships
        - Deals and pipelines
        - Outreach, sequences and sending
        - Meetings and commitments
        - Sales materials
        - Overview and analytics
        - Connections and integrations
        - MCP server and AI assistants
        - Workspaces, products and permissions
        - Keyboard and command menu
        - Self-hosting and deployment
        - Accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How you work around it now
      description: Including "a spreadsheet" or "I gave up". The workaround tells us how much the gap costs.
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: If another CRM handles this well, say which and what it gets right.
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to build it
      options:
        - label: I would like to work on this myself
        - label: I can help test it
