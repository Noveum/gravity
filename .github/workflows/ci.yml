name: CI

on:
  push:
    branches: [main, m0-1-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: gravity
          POSTGRES_PASSWORD: gravity
          POSTGRES_DB: gravity
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U gravity -d gravity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://gravity:gravity@localhost:5436/gravity
      REDIS_URL: redis://localhost:6382
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3300
      NEXT_PUBLIC_APP_URL: http://localhost:3300
      NEXT_PUBLIC_REALTIME_URL: ws://localhost:3400
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Create the test databases and push the schema to each
        run: bun run db:test-setup
      - name: Lint, comment policy, typecheck and tests
        run: bun run verify
