name: Vercel preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/main' && vars.VERCEL_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'
      CRM_DEMO_MODE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Verify project configuration
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run licenses:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: npm install --global vercel@62.2.0
      - run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy tested preview artifact
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"
